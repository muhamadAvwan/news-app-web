<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Dewan Berita Dunia</title>
<style>
  :root{
    --bg:#0a0c11; --surface:#12161e; --surface-2:#171c26; --line:#222836;
    --line-2:#2e3646;
    --text:#eef2f8; --dim:#9aa5b6; --faint:#6b7484; --accent:#5b8def;
    --glow:rgba(91,141,239,.10);
    --r:16px; --r-sm:10px;
    --sh:0 1px 2px rgba(0,0,0,.35),0 12px 34px -20px rgba(0,0,0,.85);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;color:var(--text);font-size:15px;line-height:1.55;
    font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    background:
      radial-gradient(1100px 520px at 12% -8%, var(--glow), transparent 60%),
      radial-gradient(900px 480px at 104% -4%, var(--glow), transparent 55%),
      var(--bg);
    background-attachment:fixed}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1360px;margin:0 auto;padding:0 22px}
  button,select,input{font:inherit}
  ::selection{background:color-mix(in srgb,var(--accent) 35%, transparent)}

  /* ---------- tema ---------- */
  html[data-theme="light"]{
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f8; --line:#e2e7f0;
    --line-2:#cfd8e6;
    --text:#141a24; --dim:#59637a; --faint:#8a94a7;
    --accent:#2f6fe0; --glow:rgba(47,111,224,.10);
    --sh:0 1px 2px rgba(16,24,40,.06),0 14px 34px -22px rgba(16,24,40,.35);
  }
  html[data-theme="light"] header{background:rgba(244,246,251,.78)}
  html[data-theme="light"] .brand i{background:linear-gradient(145deg,#fff,#eef1f8)}
  html[data-theme="light"] .hot{color:#b26a00;background:rgba(255,176,32,.14);
    border-color:rgba(255,176,32,.35)}
  html[data-theme="light"] .note{background:rgba(224,168,0,.10);
    border-color:rgba(200,150,0,.35);color:#8a6100}
  html[data-theme="light"] .sk .l{
    background:linear-gradient(90deg,#eef1f8,#e2e8f3,#eef1f8);background-size:200% 100%}

  /* ---------- aksen ---------- */
  html[data-accent="blue"]{--accent:#5b8def;--glow:rgba(91,141,239,.10)}
  html[data-accent="violet"]{--accent:#a855f7;--glow:rgba(168,85,247,.10)}
  html[data-accent="emerald"]{--accent:#34d399;--glow:rgba(52,211,153,.10)}
  html[data-accent="rose"]{--accent:#f472b6;--glow:rgba(244,114,182,.10)}
  html[data-accent="amber"]{--accent:#fbbf24;--glow:rgba(251,191,36,.10)}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:30;background:rgba(10,12,17,.72);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    backdrop-filter:blur(16px) saturate(140%);
    border-bottom:1px solid var(--line)}
  .top{display:flex;gap:10px;align-items:center;padding:14px 0 10px}
  .brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:650;
    letter-spacing:-.2px;white-space:nowrap}
  .brand i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;
    border-radius:9px;font-size:15px;
    background:linear-gradient(145deg,#1d2635,#12161e);border:1px solid var(--line-2)}
  .grow{flex:1}
  input[type=search],select,button{color:var(--text);background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;
    transition:background .16s var(--ease),border-color .16s var(--ease),
      color .16s var(--ease),transform .12s var(--ease)}
  input[type=search]{min-width:180px;flex:0 1 260px;cursor:text}
  input[type=search]::placeholder{color:var(--faint)}
  input[type=search]:hover,select:hover,button:hover{border-color:var(--line-2)}
  input[type=search]:focus,select:focus{outline:none;border-color:var(--accent);
    background:var(--surface-2);box-shadow:0 0 0 3px rgba(91,141,239,.15)}
  button{cursor:pointer;white-space:nowrap}
  button:hover{background:var(--surface-2)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:default}
  button.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
  #refreshBtn{border-color:var(--line-2)}
  .icon{padding:8px 10px;font-size:14px;line-height:1;color:var(--dim)}
  .icon:hover{color:var(--text)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .status{padding-bottom:12px;font-size:12.5px;color:var(--faint)}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--accent);
    display:inline-block;margin-right:6px;animation:p 1.2s infinite}
  @keyframes p{50%{opacity:.25}}

  /* ---------- filter ---------- */
  .tabs,.genres{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    -ms-overflow-style:none}
  .tabs::-webkit-scrollbar,.genres::-webkit-scrollbar{display:none}
  .tabs{padding:16px 0 0}
  .tabs button,.genres button{flex:0 0 auto;white-space:nowrap;border-radius:99px}
  .tabs button{padding:7px 15px;color:var(--dim);font-weight:500;font-size:13.5px}
  .tabs button:hover,.genres button:hover{color:var(--text);border-color:var(--line-2)}
  .tabs button.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:650}
  .n{margin-left:7px;font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
  .genres{padding:10px 0 16px;align-items:center}
  .genres .lbl{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;
    color:var(--faint);font-weight:700;margin-right:4px;flex:0 0 auto}
  .genres button{padding:5px 12px;font-size:12.5px;color:var(--dim)}
  .genres button.on{background:var(--gc);border-color:var(--gc);color:var(--bg);font-weight:650}
  .note{padding:11px 14px;border-radius:12px;background:rgba(224,196,121,.07);
    border:1px solid rgba(224,196,121,.25);color:#e6cd83;font-size:12.5px;margin:2px 0 4px}

  /* ---------- kartu ---------- */
  main{padding:6px 0 0}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  article{position:relative;overflow:hidden;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 15px;
    display:flex;flex-direction:column;gap:10px;
    transition:border-color .18s var(--ease),background .18s var(--ease),
      transform .18s var(--ease),box-shadow .18s var(--ease)}
  article::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--c,var(--accent));opacity:.9}
  article:hover{border-color:#2f3a4e;
    border-color:color-mix(in srgb,var(--c,var(--accent)) 42%,var(--line));
    background:var(--surface-2);transform:translateY(-2px);box-shadow:var(--sh)}
  .kick{display:flex;align-items:center;gap:8px}
  .kicker{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;
    letter-spacing:.7px;text-transform:uppercase;color:var(--c,var(--accent))}
  .kicker::before{content:"";width:6px;height:6px;border-radius:99px;
    background:currentColor;opacity:.85}
  .body{display:flex;flex-direction:column;gap:8px}
  .hot{margin-left:auto;font-size:11px;font-weight:700;color:#ffb547;
    background:rgba(255,181,71,.10);border:1px solid rgba(255,181,71,.22);
    padding:2px 8px;border-radius:99px}
  h3{margin:0}
  .title{font-size:16px;font-weight:620;line-height:1.38;letter-spacing:-.15px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .title:hover{color:var(--c,var(--accent))}
  .desc{margin:0;font-size:13px;line-height:1.55;color:var(--dim);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;
    padding-top:2px;font-size:12px;color:var(--faint)}
  .src{color:var(--dim);font-weight:500}
  .sep{color:#39414f}
  .g{font-weight:600}
  .tr{margin-left:auto;padding:3px 9px;font-size:11.5px;border-radius:8px;color:var(--faint);
    background:transparent;border:1px solid var(--line)}
  .tr:hover{color:var(--text);border-color:var(--line-2)}
  .tr.done{color:#5fbf87;border-color:rgba(95,191,135,.35)}

  /* ---------- layout list (layar lebar) ---------- */
  .grid.list{grid-template-columns:1fr;gap:10px}
  .grid.list article{display:grid;grid-template-columns:1fr max-content;align-items:center;
    gap:2px 20px;padding:12px 18px}
  .grid.list .kick{grid-column:1;grid-row:1}
  .grid.list .body{grid-column:1;grid-row:2}
  .grid.list .meta{grid-column:2;grid-row:1/span 2;margin:0;padding:0;
    justify-content:flex-end;max-width:360px}
  .grid.list .title{font-size:15px;-webkit-line-clamp:2}
  .grid.list .desc{-webkit-line-clamp:1}
  @media (max-width:860px){
    .grid.list article{grid-template-columns:1fr}
    .grid.list .meta{grid-column:1;grid-row:auto;justify-content:flex-start;
      max-width:none;margin-top:3px}
  }

  /* ---------- lain-lain ---------- */
  .more{display:block;margin:28px auto 0;padding:10px 24px;font-size:13.5px;
    color:var(--dim);border-radius:99px;background:var(--surface)}
  .more:hover{color:var(--text);border-color:var(--line-2);transform:translateY(-1px)}
  .empty{text-align:center;color:var(--dim);padding:80px 20px;font-size:14px}
  .empty b{display:block;font-size:17px;color:var(--text);margin-bottom:8px;font-weight:650}
  .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:34px;
    padding:16px 0 44px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint)}
  .foot b{color:var(--dim);font-weight:600}
  .sk{cursor:default}
  .sk::before{display:none}
  .sk:hover{transform:none;box-shadow:none;background:var(--surface)}
  .sk .l{height:9px;border-radius:6px;margin-bottom:10px;
    background:linear-gradient(90deg,#151a23,#1d2330,#151a23);background-size:200% 100%;
    animation:sk 1.3s infinite}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}

  @media (max-width:680px){
    .wrap{padding:0 15px}
    .top{flex-wrap:wrap;padding:12px 0 9px;gap:8px}
    .brand{flex:1 0 100%;font-size:15px}
    .grow{display:none}
    input[type=search]{order:3;flex:1 1 60px;min-width:0}
    select{order:4}
    #langBtn{order:5}
    #refreshBtn{order:6}
    #themeBtn{order:7}
    #accentBtn{order:8}
    #viewBtn{order:9}
    .status{padding-bottom:9px}
    .grid{grid-template-columns:1fr;gap:12px}
    article{padding:16px 16px 14px}
    .title{font-size:15.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand"><i>🌐</i>Dewan Berita Dunia</div>
    <div class="grow"></div>
    <input type="search" id="q" placeholder="Cari berita..." aria-label="Cari berita" />
    <select id="sort" aria-label="Urutkan">
      <option value="new">Terbaru</option>
      <option value="hot">Terpanas</option>
    </select>
    <button id="langBtn" title="Judul dalam Bahasa Indonesia">🇮🇩 ID</button>
    <button id="refreshBtn">Segarkan</button>
    <button id="themeBtn" class="icon" title="Mode terang / gelap" aria-label="Mode terang / gelap">🌙</button>
    <button id="accentBtn" class="icon" title="Ganti warna aksen" aria-label="Ganti warna aksen">🎨</button>
    <button id="viewBtn" class="icon" title="Layout grid / list" aria-label="Layout grid / list">☰</button>
  </div>
  <div class="wrap status"><span id="sub">memuat…</span></div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs"></nav>
  <nav class="genres" id="genres"></nav>
  <div id="note"></div>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <button id="more"></button>
  <div class="empty" id="empty" style="display:none"></div>
  <div class="foot" id="chips"></div>
</main>

<script>
const CATSTYLE = {
  GENTING:{label:"Genting / Urgent",color:"#ff6b6b"},
  GAME:{label:"Game / Update",color:"#4ade80"},
  ESPORTS:{label:"Esports",color:"#f472b6"},
  REVIEW_GAME:{label:"Review Game",color:"#fbbf24"},
  HARDWARE:{label:"Hardware Gaming",color:"#38bdf8"},
  BOLA:{label:"Sepak Bola",color:"#34d399"},
  BOLA_LIGA:{label:"Liga & Kompetisi",color:"#818cf8"},
  BOLA_TRANSFER:{label:"Transfer",color:"#fb923c"},
  BOLA_NASIONAL:{label:"Timnas & Liga 1",color:"#e879f9"},
  CYBER_VULN:{label:"Kerentanan & CVE",color:"#facc15"},
  CYBER_MALWARE:{label:"Malware & Ransomware",color:"#ef4444"},
  CYBER_APT:{label:"Threat Intel & APT",color:"#a855f7"},
  CYBER_BREACH:{label:"Kebocoran Data",color:"#f472b6"},
  CYBER_BUG:{label:"Bug Bounty & Pentest",color:"#c084fc"},
  CYBER_TOOL:{label:"Tool Offensive & Red Team",color:"#22d3ee"},
  CYBER_BLUE:{label:"Blue Team / DFIR / SOC",color:"#38bdf8"},
  CYBER_CLOUD:{label:"Cloud & Container",color:"#2dd4bf"},
  CYBER_APP:{label:"AppSec & Web",color:"#4ade80"},
  CYBER_RE:{label:"Reverse Engineering",color:"#fb923c"},
  CYBER_AI:{label:"AI Security",color:"#818cf8"},
  CYBER_GRC:{label:"Regulasi & GRC",color:"#94a3b8"},
  POLITIK_ID:{label:"Politik Dalam Negeri",color:"#60a5fa"},
  POLITIK_INT:{label:"Politik Internasional",color:"#a78bfa"},
  DUNIA_ID:{label:"Indonesia di Dunia",color:"#f43f5e"},
  TRADER:{label:"Trader / Pasar",color:"#fcd34d"},
  LAINNYA:{label:"Lainnya",color:"#9aa4b2"}
};
const PAGE = 60;
const TR_CACHE_KEY = "dbd_translations_v1";
const TR_CACHE_TTL = 14*24*3600*1000;
const S = {data:null, tab:"ALL", genre:"", sort:"new", lang:"orig", q:"", limit:PAGE,
           translating:new Set(), noTrans:false, trCache:{}, trAvail:"unknown"};

const $ = s => document.querySelector(s);
const grid = $("#grid");

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function ago(iso){
  if(!iso) return "";
  const d=(Date.now()-new Date(iso))/1000;
  if(d<60) return "baru saja";
  if(d<3600) return Math.floor(d/60)+" mnt lalu";
  if(d<86400) return Math.floor(d/3600)+" jam lalu";
  return Math.floor(d/86400)+" hr lalu";
}
function shown(a){return S.lang==="id" ? (a.title_id || a.title) : a.title}
function hotPill(h){
  return h>=55 ? `<span class="hot" title="Skor panas ${h}">🔥 ${h}</span>` : "";
}
function skeleton(){
  grid.innerHTML = Array.from({length:6},()=>
    `<article class="sk"><div class="l" style="width:35%"></div><div class="l" style="width:92%"></div>
     <div class="l" style="width:70%"></div><div class="l" style="width:45%"></div></article>`).join("");
}

/* ---------- terjemahan ---------- */
let _trInst = null;
async function getTranslator(){
  if(_trInst) return _trInst;
  if(!("Translator" in self)){ S.trAvail="noapi"; return null }
  try{
    const av = await Translator.availability({sourceLanguage:"en", targetLanguage:"id"});
    S.trAvail = av;
    if(av==="unavailable") return null;
    _trInst = await Translator.create({sourceLanguage:"en", targetLanguage:"id"});
    S.trAvail = "available";
    return _trInst;
  }catch(e){
    S.trAvail = "unavailable";
    return null;
  }
}
function trLoad(){
  try{
    const o=JSON.parse(localStorage.getItem(TR_CACHE_KEY)||"{}"), now=Date.now();
    Object.keys(o).forEach(k=>{ if(now-o[k].ts < TR_CACHE_TTL) S.trCache[k]=o[k].v });
  }catch(e){}
}
function trSave(){
  try{
    const now=Date.now(), o={};
    Object.keys(S.trCache).forEach(k=>{ o[k]={v:S.trCache[k],ts:now} });
    localStorage.setItem(TR_CACHE_KEY, JSON.stringify(o));
  }catch(e){}
}
async function translate(ids){
  if(!S.data) return;
  const arts=S.data.articles, pending=[];
  ids.forEach(id=>{
    if(S.trCache[id]){
      const a=arts.find(x=>x.id===id);
      if(a) a.title_id=S.trCache[id];
    }else if(!S.translating.has(id)){
      pending.push(id); S.translating.add(id);
    }
  });
  if(pending.length) render();
  if(!pending.length){ renderHeader(); return }
  const need=[];
  pending.forEach(id=>{
    const a=arts.find(x=>x.id===id);
    if(!a) return;
    if((a.lang||"")==="id"){ a.title_id=a.title; S.trCache[id]=a.title }
    else need.push(a);
  });
  if(!need.length){
    pending.forEach(i=>S.translating.delete(i));
    trSave(); render(); renderHeader(); return;
  }
  const tr=await getTranslator();
  if(!tr){
    S.noTrans=true;
    pending.forEach(i=>S.translating.delete(i));
    render(); renderHeader(); return;
  }
  for(const a of need){
    try{ const out=await tr.translate(a.title); a.title_id=(out||"").trim()||a.title }
    catch(e){ a.title_id=a.title }
    S.trCache[a.id]=a.title_id;
    S.translating.delete(a.id);
  }
  S.noTrans=false;
  trSave(); render(); renderHeader();
}
function ensureTr(){
  if(S.lang!=="id" || !S.data) return;
  const ids=visible().filter(a=>!a.title_id).slice(0,40).map(a=>a.id);
  if(ids.length) translate(ids);
}

/* ---------- filter ---------- */
function GENRE(code){
  return (S.data?.genres||[]).find(g=>g.code===code)||{code,label:code,color:"#9aa4b2"};
}
function renderTabs(){
  const d=S.data; if(!d) return;
  const counts={ALL:d.articles.length};
  Object.keys(CATSTYLE).forEach(c=>counts[c]=0);
  d.articles.forEach(a=>counts[a.category]=(counts[a.category]||0)+1);
  const tabs=[["ALL","Semua"]].concat((d.categories||[]).map(c=>[c.code,c.label]));
  $("#tabs").innerHTML = tabs.map(([code,label])=>
    `<button data-tab="${code}" class="${S.tab===code?"on":""}">${esc(label)}<span class="n">${counts[code]||0}</span></button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    S.tab=b.dataset.tab; S.limit=PAGE;
    renderTabs(); renderGenres(); render(); ensureTr();
  });
}
// Genre jadi sub-filter dari tab: dihitung hanya di dalam tab aktif supaya
// angkanya tidak menyesatkan, dan kombinasi kategori+genre yang kosong
// otomatis tampil pesan "tidak ada berita".
function renderGenres(){
  const d=S.data, box=$("#genres");
  if(!d){ box.innerHTML=""; return }
  const base = S.tab==="ALL" ? d.articles : d.articles.filter(a=>a.category===S.tab);
  const counts={};
  base.forEach(a=>(a.genres||[]).forEach(g=>counts[g]=(counts[g]||0)+1));
  const total=Object.values(counts).reduce((x,y)=>x+y,0);
  // Kalau tab aktif tidak punya satu pun artikel ber-genre, barisnya
  // disembunyikan supaya tidak menampilkan angka 0 semua.
  if(S.tab!=="ALL" && total===0){ S.genre=""; box.innerHTML=""; return }
  const chips=[["","Semua","#4f8ef7",base.length]]
    .concat((d.genres||[]).map(g=>[g.code,g.label,g.color,counts[g.code]||0]));
  box.innerHTML = `<span class="lbl">Genre</span>` + chips.map(([code,label,color,n])=>
    `<button data-genre="${code}" class="${S.genre===code?"on":""}" style="--gc:${color}">${esc(label)}<span class="n">${n}</span></button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    S.genre=b.dataset.genre; S.limit=PAGE;
    renderGenres(); render();
  });
}
function visible(){
  let list = (S.data?.articles)||[];
  if(S.tab!=="ALL") list = list.filter(a=>a.category===S.tab);
  if(S.genre) list = list.filter(a=>(a.genres||[]).includes(S.genre));
  if(S.q){
    const q=S.q.toLowerCase();
    list = list.filter(a=>(shown(a)+" "+a.source).toLowerCase().includes(q));
  }
  list = list.slice();
  list.sort(S.sort==="new"
    ? (a,b)=>(new Date(b.published||0))-(new Date(a.published||0))
    : (a,b)=>b.hotness-a.hotness || (new Date(b.published||0))-(new Date(a.published||0)));
  return list;
}

/* ---------- kartu ---------- */
function card(a){
  const cs=CATSTYLE[a.category]||CATSTYLE.LAINNYA;
  const t=shown(a);
  const needsId = S.lang==="id" && !a.title_id && !S.noTrans;
  const lg = a.lang==="en" ? ' lang="en" translate="yes"' : "";
  const multi = a.source_count>1 ? ` +${a.source_count-1}` : "";
  const gs = (a.genres||[]).slice(0,2).map(c=>{
    const g=GENRE(c);
    return `<span class="g" style="color:${g.color}">${esc(g.label)}</span>`;
  });
  if((a.genres||[]).length>2) gs.push(`<span class="g">+${a.genres.length-2}</span>`);

  const el=document.createElement("article");
  el.style.setProperty("--c", cs.color);
  el.innerHTML=`
    <div class="kick">
      <span class="kicker">${esc(cs.label)}</span>
      ${hotPill(a.hotness)}
    </div>
    <div class="body">
      <h3><a class="title"${lg} href="${esc(a.url)}" target="_blank" rel="noopener">${esc(t)}</a></h3>
      ${a.desc?`<p class="desc"${lg}>${esc(a.desc)}</p>`:""}
    </div>
    <div class="meta">
      <span class="src">${esc(a.source)}${multi}</span>
      <span class="sep">·</span><span>${ago(a.published)}</span>
      ${gs.length?`<span class="sep">·</span>${gs.join('<span class="sep">·</span>')}`:""}
      <button class="tr" title="Terjemahkan judul ini ke Bahasa Indonesia">🇮🇩</button>
    </div>`;
  const b=el.querySelector(".tr");
  if(a.title_id){ b.textContent="✔"; b.classList.add("done") }
  else if(S.translating.has(a.id)) b.textContent="…";
  b.onclick=()=>translate([a.id]);
  if(needsId) el.querySelector(".title").style.color="var(--faint)";
  return el;
}
function render(){
  const list=visible();
  grid.innerHTML="";
  list.slice(0,S.limit).forEach(a=>grid.appendChild(card(a)));
  const more=$("#more"), rest=list.length-S.limit;
  more.style.display = rest>0 ? "block" : "none";
  more.textContent = `Muat ${Math.min(PAGE,rest)} berita lagi · sisa ${rest}`;
  $("#empty").style.display = list.length ? "none" : "block";
  if(!list.length) $("#empty").innerHTML = S.data
    ? `<b>Tidak ada berita</b>${S.genre
        ? `${esc(GENRE(S.genre).label)} di ${esc((CATSTYLE[S.tab]||{label:"kategori ini"}).label)}`
        : "di kategori ini"}.`
    : `<b>Memuat berita…</b>Tarik ke bawah atau tekan Segarkan untuk mencoba lagi.`;
}

function renderHeader(){
  const d=S.data; if(!d) return;
  const mins=Math.max(0,Math.round((d.next_refresh_ts*1000-Date.now())/60000));
  $("#sub").innerHTML = `${d.articles.length} berita · update ${ago(d.updated_at)} · refresh ${mins} mnt lagi${d.refreshing?' · <span class="dot"></span>mengambil':""}`;
  const chips=[
    d.brain==="ai" ? `Otak AI · ${esc(d.provider||"")}` : "Klasifikasi kata kunci",
    `sumber aktif <b>${d.sources_ok.length}</b>`,
    d.sources_fail.length ? `gagal <b>${d.sources_fail.length}</b>` : "",
    d.translate_engine==="browser" ? "terjemahan: bawaan browser" : ""
  ].filter(Boolean);
  $("#chips").innerHTML = chips.map(c=>`<span>${c}</span>`).join('<span class="sep">·</span>');

  if(S.lang==="id" && (S.noTrans||S.trAvail==="noapi"||S.trAvail==="unavailable")){
    $("#note").innerHTML=`<div class="note">Terjemahan otomatis belum aktif di browser ini. Pakai fitur bawaan browser: <b>klik kanan di halaman → "Terjemahkan ke Bahasa Indonesia"</b> (Chrome/Edge), lakukan setelah berita muncul.</div>`;
  }else{
    $("#note").innerHTML="";
  }
}

async function poll(force){
  try{
    const r=await fetch("/api/news",force?{cache:"no-store"}:{});
    const d=await r.json();
    S.data=d; S.noTrans=false;
    (d.articles||[]).forEach(a=>{ if(S.trCache[a.id]) a.title_id=S.trCache[a.id] });
    renderHeader(); renderTabs(); renderGenres(); render(); ensureTr();
  }catch(e){
    if(!S.data) $("#sub").textContent="Gagal memuat berita — tekan Segarkan untuk mencoba lagi.";
  }
}

/* ---------- kontrol ---------- */
$("#q").oninput=e=>{ S.q=e.target.value.trim(); S.limit=PAGE; render(); ensureTr() };
$("#sort").onchange=e=>{ S.sort=e.target.value; S.limit=PAGE; render(); ensureTr() };
$("#more").onclick=()=>{ S.limit+=PAGE; render(); ensureTr() };
$("#langBtn").onclick=()=>{
  S.lang = S.lang==="id" ? "orig" : "id";
  const b=$("#langBtn");
  b.classList.toggle("on",S.lang==="id");
  b.textContent = S.lang==="id" ? "🌍 Asli" : "🇮🇩 ID";
  render(); renderHeader(); ensureTr();
};
$("#refreshBtn").onclick=async()=>{
  const b=$("#refreshBtn");
  b.disabled=true; b.innerHTML='<span class="dot"></span>Mengambil';
  await poll(true);
  b.disabled=false; b.textContent="Segarkan";
};

/* ---------- tema, aksen, layout ---------- */
const ACCENTS=["blue","violet","emerald","rose","amber"];
function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function lsSet(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
let THEME = lsGet("dbd_theme")==="light" ? "light" : "dark";
let AC = lsGet("dbd_accent");
let ACCENT = ACCENTS.includes(AC) ? AC : "blue";
let VIEW = lsGet("dbd_view")==="list" ? "list" : "grid";
function applyTheme(){
  if(THEME==="light") document.documentElement.dataset.theme="light";
  else delete document.documentElement.dataset.theme;
  $("#themeBtn").textContent = THEME==="light" ? "☀️" : "🌙";
}
function applyAccent(){ document.documentElement.dataset.accent=ACCENT }
function applyView(){
  grid.classList.toggle("list",VIEW==="list");
  $("#viewBtn").textContent = VIEW==="list" ? "▦" : "☰";
}
applyTheme(); applyAccent(); applyView();
$("#themeBtn").onclick=()=>{ THEME=THEME==="light"?"dark":"light"; lsSet("dbd_theme",THEME); applyTheme() };
$("#accentBtn").onclick=()=>{ ACCENT=ACCENTS[(ACCENTS.indexOf(ACCENT)+1)%ACCENTS.length]; lsSet("dbd_accent",ACCENT); applyAccent() };
$("#viewBtn").onclick=()=>{ VIEW=VIEW==="list"?"grid":"list"; lsSet("dbd_view",VIEW); applyView() };

trLoad();
skeleton();
(async()=>{
  if("Translator" in self){
    try{ S.trAvail = await Translator.availability({sourceLanguage:"en", targetLanguage:"id"}) }
    catch(e){ S.trAvail = "unavailable" }
  }else{
    S.trAvail = "noapi";
  }
  await poll(false);
  setInterval(()=>poll(false),300000);
})();
</script>
</body>
</html>
